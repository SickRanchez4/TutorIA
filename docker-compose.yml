services:
  app:
    image: rastone/tutoria:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    env_file:
      - .env.docker
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_UPLOAD_STORAGE_PATH: /data/rag-uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:5000"
    restart: unless-stopped
