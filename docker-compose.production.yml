services:
  frontend:
    ports:
      - "127.0.0.1:8080:80"
    expose:
      - "80"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: